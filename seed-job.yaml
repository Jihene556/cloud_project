apiVersion: batch/v1
kind: Job
metadata:
  name: seed
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        job-name: seed  
    spec:
      restartPolicy: Never  # Ne redémarre pas en cas d'échec
      containers:
        - name: seed
          image: europe-west9-docker.pkg.dev/tuto-jihene/voting-image/seed

      
